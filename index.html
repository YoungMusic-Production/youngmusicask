<!DOCTYPE html>
<html lang="zh">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
 <title>YOUNG MUSIC | 匠心定制</title>
 <style>
 * { margin: 0; padding: 0; box-sizing: border-box; }
 body { 
 background-color: #000; 
 height: 100vh; 
 display: flex; 
 flex-direction: column; 
 align-items: center; 
 justify-content: center; 
 font-family: -apple-system, sans-serif;
 }
 .logo-container { text-align: center; margin-bottom: 50px; }
 .main-logo { width: 80px; height: auto; margin-bottom: 20px; }
 .brand-name {
 color: #D4AF37;
 font-size: 1.8em;
 letter-spacing: 10px;
 font-weight: 300;
 text-transform: uppercase;
 }
 .enter-btn {
 margin-top: 30px;
 color: #ffffff;
 text-decoration: none;
 font-size: 0.8em;
 letter-spacing: 5px;
 font-weight: 300;
 text-transform: uppercase;
 text-shadow: 0 0 10px rgba(255,255,255,0.3);
 animation: breathe 3s infinite ease-in-out;
 display: inline-block;
 }
 @keyframes breathe {
 0%, 100% { opacity: 0.5; transform: scale(1); }
 50% { opacity: 1; transform: scale(1.05); }
 }
 .footer-text {
 position: absolute;
 bottom: 30px;
 color: #333;
 font-size: 0.6em;
 letter-spacing: 2px;
 }
 </style>
</head>
<body>
 <div class="logo-container">
 <img src="logo.png" alt="YOUNG MUSIC" class="main-logo" onerror="this.style.display='none'">
 <div class="brand-name">YOUNG MUSIC</div>
 <a href="features.html" class="enter-btn">CLICK TO ENTER</a>
 </div>
 <div class="footer-text">PREMIUM BESPOKE AUDIO</div>
</body>
</html>
